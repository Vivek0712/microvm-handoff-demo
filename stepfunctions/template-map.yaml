AWSTemplateFormatVersion: '2010-09-09'
Description: >
  mvm-demo-sfn-map: a Step Functions machine that leases one demo-agent Lambda MicroVM per
  element of the input's `shards` array with a Map over runMicrovm.waitForTaskToken, at most
  MaxConcurrency at a time, behind an SNS approval gate above ApproveAboveShards shards. The
  stack owns the approval topic and an SQS queue subscribed with raw delivery for the approver.
  Generated by generate.py from microvm.integrations.stepfunctions (microvm-ctl 0.3.0);
  do not edit by hand.

Parameters:
  ImageName:
    Type: String
    Default: demo-agent
    Description: Name of the agent MicroVM image built with `mvm image build`.
  Budget:
    Type: Number
    Default: 120
    Description: Seconds each shard's lease waits for its VM (TimeoutSeconds); the VM cap is Budget + 60.
  MaxConcurrency:
    Type: Number
    Default: 4
    MinValue: 1
    Description: Shards in flight at once (the policy's max_concurrency; `mvm lease plan` prints it).
  ApproveAboveShards:
    Type: Number
    Default: 8
    MinValue: 0
    Description: Executions with more shards than this publish to the approval topic and wait for a token.
  ApprovalTopicName:
    Type: String
    Default: mvm-demo-approvals
    Description: Name of the SNS topic the Gate publishes to.
  ApprovalQueueName:
    Type: String
    Default: mvm-demo-approvals-q
    Description: Name of the SQS queue subscribed to the topic; the approver reads task tokens here.

Resources:
  # ---- approval plumbing: RequestApproval publishes here; the approver reads the queue
  ApprovalTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Ref ApprovalTopicName

  ApprovalQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref ApprovalQueueName
      MessageRetentionPeriod: 3600
      ReceiveMessageWaitTimeSeconds: 10

  ApprovalQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref ApprovalQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: sns.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt ApprovalQueue.Arn
            Condition:
              ArnEquals: { aws:SourceArn: !Ref ApprovalTopic }

  ApprovalSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref ApprovalTopic
      Protocol: sqs
      Endpoint: !GetAtt ApprovalQueue.Arn
      RawMessageDelivery: true

  # ---- the role the leased VM runs as: logs on both group prefixes, task token calls back to this machine
  AgentExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-agent
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: [sts:AssumeRole, sts:TagSession]
      Policies:
        - PolicyName: agent
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda-microvms/*
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/microvms/*
              - Sid: CompleteTheLease
                Effect: Allow
                Action: [states:SendTaskSuccess, states:SendTaskFailure, states:SendTaskHeartbeat]
                # the machine is named below so this ARN is known before it exists (no circular reference)
                Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-lease"

  # ---- the role the state machine runs as: launch, list, terminate, pass the agent role, publish the gate
  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-states
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: states.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: orchestrator
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [lambda:RunMicrovm, lambda:TerminateMicrovm, lambda:ListMicrovms, lambda:GetMicrovm]
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt AgentExecutionRole.Arn
              - Effect: Allow
                Action: lambda:PassNetworkConnector
                Resource: arn:aws:lambda:*:aws:network-connector:aws-network-connector:*
              - Effect: Allow
                Action: [logs:CreateLogDelivery, logs:GetLogDelivery, logs:UpdateLogDelivery,
                         logs:DeleteLogDelivery, logs:ListLogDeliveries, logs:PutResourcePolicy,
                         logs:DescribeResourcePolicies, logs:DescribeLogGroups, logs:PutLogEvents,
                         logs:CreateLogStream]
                Resource: "*"
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref ApprovalTopic

  StateMachineLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/vendedlogs/states/${AWS::StackName}
      RetentionInDays: 14

  # ---- Gate -> RequestApproval -> Fanout (Map: Lease -> Terminate -> ShardDone per shard) -> Done
  StateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ${AWS::StackName}-lease
      StateMachineType: STANDARD
      RoleArn: !GetAtt StateMachineRole.Arn
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogs.Arn
      DefinitionString: !Sub |
        {
          "Comment": "microvm-ctl lease fan-out of ${ImageName}: ${MaxConcurrency} at a time, budget ${Budget}s, VM cap Budget + 60s, approval above ${ApproveAboveShards} shards (generated by generate.py, do not edit by hand)",
          "QueryLanguage": "JSONata",
          "StartAt": "Gate",
          "States": {
            "Gate": {
              "Type": "Choice",
              "Choices": [
                {
                  "Condition": "{% $count($states.input.shards) > ${ApproveAboveShards} %}",
                  "Next": "RequestApproval"
                }
              ],
              "Default": "Fanout"
            },
            "RequestApproval": {
              "Type": "Task",
              "Resource": "arn:aws:states:::sns:publish.waitForTaskToken",
              "Arguments": {
                "TopicArn": "${ApprovalTopic}",
                "Message": "{% $string({'action': 'microvm-ctl lease fan-out approval', 'shards': $count($states.input.shards), 'image': 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${ImageName}', 'execution': $states.context.Execution.Name, 'task_token': $states.context.Task.Token}) %}"
              },
              "TimeoutSeconds": 3600,
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.Timeout",
                    "States.TaskFailed"
                  ],
                  "Next": "Denied"
                }
              ],
              "Output": "{% $states.input %}",
              "Next": "Fanout"
            },
            "Denied": {
              "Type": "Fail",
              "Error": "ApprovalDenied",
              "Cause": "no approval within 3600s, or the approver sent a task failure"
            },
            "Fanout": {
              "Type": "Map",
              "Items": "{% $map($states.input.shards, function($v, $i) { {'index': $i, 'task': $v} }) %}",
              "MaxConcurrency": ${MaxConcurrency},
              "ItemProcessor": {
                "ProcessorConfig": {
                  "Mode": "INLINE"
                },
                "StartAt": "Lease",
                "States": {
                  "Lease": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:runMicrovm.waitForTaskToken",
                    "Arguments": {
                      "ImageIdentifier": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${ImageName}",
                      "ExecutionRoleArn": "${AgentExecutionRole.Arn}",
                      "RunHookPayload": "{% $string({'lease': {'kind': 'sfn', 'token': $states.context.Task.Token, 'region': '${AWS::Region}', 'heartbeat_s': 10, 'id': $states.context.Execution.Name & '-' & $string($states.input.index)}, 'task': $states.input.task}) %}",
                      "IdlePolicy": {
                        "MaxIdleDurationSeconds": ${Budget},
                        "SuspendedDurationSeconds": 60,
                        "AutoResumeEnabled": false
                      },
                      "MaximumDurationInSeconds": "{% ${Budget} + 60 %}",
                      "ClientToken": "{% $substring($states.context.Execution.Name & '-' & $states.context.State.Name & '-' & $string($states.input.index), 0, 128) %}"
                    },
                    "TimeoutSeconds": ${Budget},
                    "HeartbeatSeconds": 30,
                    "Retry": [
                      {
                        "ErrorEquals": [
                          "LambdaMicrovms.ThrottlingException",
                          "LambdaMicrovms.ServiceQuotaExceededException"
                        ],
                        "IntervalSeconds": 2,
                        "MaxAttempts": 8,
                        "BackoffRate": 2,
                        "JitterStrategy": "FULL"
                      }
                    ],
                    "Catch": [
                      {
                        "ErrorEquals": [
                          "States.Timeout",
                          "States.HeartbeatTimeout",
                          "States.TaskFailed"
                        ],
                        "Assign": {
                          "lease_error": "{% $states.errorOutput %}"
                        },
                        "Next": "OnLeaseError"
                      }
                    ],
                    "Assign": {
                      "vm": "{% $states.result.microvm_id %}"
                    },
                    "Next": "Terminate"
                  },
                  "OnLeaseError": {
                    "Type": "Choice",
                    "Choices": [
                      {
                        "Condition": "{% $contains($string($lease_error.Cause), '\"microvm_id\"') %}",
                        "Next": "TerminateFailed"
                      }
                    ],
                    "Default": "Reap"
                  },
                  "TerminateFailed": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:terminateMicrovm",
                    "Arguments": {
                      "MicrovmIdentifier": "{% $parse($lease_error.Cause).microvm_id %}"
                    },
                    "Retry": [
                      {
                        "ErrorEquals": [
                          "LambdaMicrovms.ThrottlingException",
                          "LambdaMicrovms.ServiceQuotaExceededException"
                        ],
                        "IntervalSeconds": 2,
                        "MaxAttempts": 8,
                        "BackoffRate": 2,
                        "JitterStrategy": "FULL"
                      }
                    ],
                    "Catch": [
                      {
                        "ErrorEquals": [
                          "States.ALL"
                        ],
                        "Next": "Reap"
                      }
                    ],
                    "Next": "Reap"
                  },
                  "Terminate": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:terminateMicrovm",
                    "Arguments": {
                      "MicrovmIdentifier": "{% $vm %}"
                    },
                    "Retry": [
                      {
                        "ErrorEquals": [
                          "LambdaMicrovms.ThrottlingException",
                          "LambdaMicrovms.ServiceQuotaExceededException"
                        ],
                        "IntervalSeconds": 2,
                        "MaxAttempts": 8,
                        "BackoffRate": 2,
                        "JitterStrategy": "FULL"
                      }
                    ],
                    "Catch": [
                      {
                        "ErrorEquals": [
                          "LambdaMicrovms.ResourceNotFoundException"
                        ],
                        "Output": "{% $states.input %}",
                        "Next": "ShardDone"
                      }
                    ],
                    "Output": "{% $states.input %}",
                    "Next": "ShardDone"
                  },
                  "Reap": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:listMicrovms",
                    "Arguments": {
                      "ImageIdentifier": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${ImageName}"
                    },
                    "Catch": [
                      {
                        "ErrorEquals": [
                          "States.ALL"
                        ],
                        "Next": "Failed"
                      }
                    ],
                    "Next": "TerminateStale"
                  },
                  "TerminateStale": {
                    "Type": "Map",
                    "Items": "{% [$states.input.Items[State in ['RUNNING', 'SUSPENDED', 'PENDING'] and $toMillis(StartedAt) < $toMillis($now()) - (${Budget} + 60) * 1000]] %}",
                    "MaxConcurrency": 4,
                    "ItemProcessor": {
                      "ProcessorConfig": {
                        "Mode": "INLINE"
                      },
                      "StartAt": "TerminateOne",
                      "States": {
                        "TerminateOne": {
                          "Type": "Task",
                          "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:terminateMicrovm",
                          "Arguments": {
                            "MicrovmIdentifier": "{% $states.input.MicrovmId %}"
                          },
                          "Retry": [
                            {
                              "ErrorEquals": [
                                "LambdaMicrovms.ThrottlingException",
                                "LambdaMicrovms.ServiceQuotaExceededException"
                              ],
                              "IntervalSeconds": 2,
                              "MaxAttempts": 8,
                              "BackoffRate": 2,
                              "JitterStrategy": "FULL"
                            }
                          ],
                          "Catch": [
                            {
                              "ErrorEquals": [
                                "LambdaMicrovms.ResourceNotFoundException"
                              ],
                              "Next": "AlreadyGone"
                            }
                          ],
                          "End": true
                        },
                        "AlreadyGone": {
                          "Type": "Pass",
                          "End": true
                        }
                      }
                    },
                    "Catch": [
                      {
                        "ErrorEquals": [
                          "States.ALL"
                        ],
                        "Next": "Failed"
                      }
                    ],
                    "Next": "Failed"
                  },
                  "Failed": {
                    "Type": "Fail",
                    "Error": "LeaseFailed",
                    "Cause": "{% $string($lease_error) %}"
                  },
                  "ShardDone": {
                    "Type": "Succeed"
                  }
                }
              },
              "Next": "Done"
            },
            "Done": {
              "Type": "Succeed"
            }
          }
        }

Outputs:
  StateMachineArn:
    Value: !Ref StateMachine
    Description: 'Start executions here with {"shards": [task, ...]}; run.py reads it from the stack.'
  ApprovalTopicArn:
    Value: !Ref ApprovalTopic
    Description: RequestApproval publishes the shard count, image, execution, and task token here.
  ApprovalQueueUrl:
    Value: !Ref ApprovalQueue
    Description: The approver reads raw SNS messages here and calls SendTaskSuccess or SendTaskFailure.
  AgentExecutionRoleArn:
    Value: !GetAtt AgentExecutionRole.Arn
    Description: Pass as MVM_EXECUTION_ROLE_ARN when leasing the agent image by hand.
  LogGroupName:
    Value: !Ref StateMachineLogs
    Description: Where the machine writes its execution logs.
