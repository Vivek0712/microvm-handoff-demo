AWSTemplateFormatVersion: '2010-09-09'
Description: >
  mvm-demo-sfn: Step Functions machines that lease the demo-agent Lambda MicroVM to one task
  with runMicrovm.waitForTaskToken and let the VM complete the task token itself. Two
  machines because TimeoutSeconds is fixed at deploy time: mvm-demo-sfn-lease (Budget) and
  mvm-demo-sfn-lease-short (ShortBudget, for the hang scenario). Generated by generate.py
  from microvm.integrations.stepfunctions (microvm-ctl 0.3.0); do not edit by hand.

Parameters:
  ImageName:
    Type: String
    Default: demo-agent
    Description: Name of the agent MicroVM image built with `mvm image build`.
  Budget:
    Type: Number
    Default: 120
    Description: Seconds mvm-demo-sfn-lease waits for the VM (TimeoutSeconds); the VM cap is Budget + 60.
  ShortBudget:
    Type: Number
    Default: 60
    Description: Seconds mvm-demo-sfn-lease-short waits for the VM; the VM cap is ShortBudget + 60.

Resources:
  # ---- the role the leased VM runs as: logs on both group prefixes, task token calls back to these machines
  AgentExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-agent
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: [sts:AssumeRole, sts:TagSession]
      Policies:
        - PolicyName: agent
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda-microvms/*
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/microvms/*
              - Sid: CompleteTheLease
                Effect: Allow
                Action: [states:SendTaskSuccess, states:SendTaskFailure, states:SendTaskHeartbeat]
                # the machines are named below so these ARNs are known before they exist (no circular ref)
                Resource:
                  - !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-lease"
                  - !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-lease-short"

  # ---- the role the state machines run as: launch, list, terminate, pass the agent role, write their logs
  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-states
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: states.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: orchestrator
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [lambda:RunMicrovm, lambda:TerminateMicrovm, lambda:ListMicrovms, lambda:GetMicrovm]
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt AgentExecutionRole.Arn
              - Effect: Allow
                Action: lambda:PassNetworkConnector
                Resource: arn:aws:lambda:*:aws:network-connector:aws-network-connector:*
              - Effect: Allow
                Action: [logs:CreateLogDelivery, logs:GetLogDelivery, logs:UpdateLogDelivery,
                         logs:DeleteLogDelivery, logs:ListLogDeliveries, logs:PutResourcePolicy,
                         logs:DescribeResourcePolicies, logs:DescribeLogGroups, logs:PutLogEvents,
                         logs:CreateLogStream]
                Resource: "*"

  StateMachineLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/vendedlogs/states/${AWS::StackName}
      RetentionInDays: 14

  # ---- Lease (waitForTaskToken) -> Terminate -> Done; failures -> Reap -> TerminateStale -> Failed
  StateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ${AWS::StackName}-lease
      StateMachineType: STANDARD
      RoleArn: !GetAtt StateMachineRole.Arn
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogs.Arn
      DefinitionString: !Sub |
        {
          "Comment": "microvm-ctl lease of ${ImageName}: budget ${Budget}s, VM cap Budget + 60s (generated by generate.py, do not edit by hand)",
          "QueryLanguage": "JSONata",
          "StartAt": "Lease",
          "States": {
            "Lease": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:runMicrovm.waitForTaskToken",
              "Arguments": {
                "ImageIdentifier": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${ImageName}",
                "ExecutionRoleArn": "${AgentExecutionRole.Arn}",
                "RunHookPayload": "{% $string({'lease': {'kind': 'sfn', 'token': $states.context.Task.Token, 'region': '${AWS::Region}', 'heartbeat_s': 10, 'id': $states.context.Execution.Name}, 'task': $states.input}) %}",
                "IdlePolicy": {
                  "MaxIdleDurationSeconds": ${Budget},
                  "SuspendedDurationSeconds": 60,
                  "AutoResumeEnabled": false
                },
                "MaximumDurationInSeconds": "{% ${Budget} + 60 %}",
                "ClientToken": "{% $substring($states.context.Execution.Name & '-' & $states.context.State.Name, 0, 128) %}"
              },
              "TimeoutSeconds": ${Budget},
              "HeartbeatSeconds": 30,
              "Retry": [
                {
                  "ErrorEquals": [
                    "LambdaMicrovms.ThrottlingException",
                    "LambdaMicrovms.ServiceQuotaExceededException"
                  ],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 8,
                  "BackoffRate": 2,
                  "JitterStrategy": "FULL"
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.Timeout",
                    "States.HeartbeatTimeout",
                    "States.TaskFailed"
                  ],
                  "Assign": {
                    "lease_error": "{% $states.errorOutput %}"
                  },
                  "Next": "Reap"
                }
              ],
              "Assign": {
                "vm": "{% $states.result.microvm_id %}"
              },
              "Next": "Terminate"
            },
            "Terminate": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:terminateMicrovm",
              "Arguments": {
                "MicrovmIdentifier": "{% $vm %}"
              },
              "Retry": [
                {
                  "ErrorEquals": [
                    "LambdaMicrovms.ThrottlingException",
                    "LambdaMicrovms.ServiceQuotaExceededException"
                  ],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 8,
                  "BackoffRate": 2,
                  "JitterStrategy": "FULL"
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": [
                    "LambdaMicrovms.ResourceNotFoundException"
                  ],
                  "Output": "{% $states.input %}",
                  "Next": "Done"
                }
              ],
              "Output": "{% $states.input %}",
              "Next": "Done"
            },
            "Reap": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:listMicrovms",
              "Arguments": {
                "ImageIdentifier": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${ImageName}"
              },
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],
                  "Next": "Failed"
                }
              ],
              "Next": "TerminateStale"
            },
            "TerminateStale": {
              "Type": "Map",
              "Items": "{% [$states.input.Items[State in ['RUNNING', 'SUSPENDED', 'PENDING'] and $toMillis(StartedAt) < $toMillis($now()) - (${Budget} + 60) * 1000]] %}",
              "MaxConcurrency": 4,
              "ItemProcessor": {
                "ProcessorConfig": {
                  "Mode": "INLINE"
                },
                "StartAt": "TerminateOne",
                "States": {
                  "TerminateOne": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:terminateMicrovm",
                    "Arguments": {
                      "MicrovmIdentifier": "{% $states.input.MicrovmId %}"
                    },
                    "Retry": [
                      {
                        "ErrorEquals": [
                          "LambdaMicrovms.ThrottlingException",
                          "LambdaMicrovms.ServiceQuotaExceededException"
                        ],
                        "IntervalSeconds": 2,
                        "MaxAttempts": 8,
                        "BackoffRate": 2,
                        "JitterStrategy": "FULL"
                      }
                    ],
                    "Catch": [
                      {
                        "ErrorEquals": [
                          "LambdaMicrovms.ResourceNotFoundException"
                        ],
                        "Next": "AlreadyGone"
                      }
                    ],
                    "End": true
                  },
                  "AlreadyGone": {
                    "Type": "Pass",
                    "End": true
                  }
                }
              },
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],
                  "Next": "Failed"
                }
              ],
              "Next": "Failed"
            },
            "Failed": {
              "Type": "Fail",
              "Error": "LeaseFailed",
              "Cause": "{% $string($lease_error) %}"
            },
            "Done": {
              "Type": "Succeed"
            }
          }
        }

  # ---- the same machine with ShortBudget: the hang scenario times out here
  ShortStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ${AWS::StackName}-lease-short
      StateMachineType: STANDARD
      RoleArn: !GetAtt StateMachineRole.Arn
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogs.Arn
      DefinitionString: !Sub |
        {
          "Comment": "microvm-ctl lease of ${ImageName}: budget ${ShortBudget}s, VM cap ShortBudget + 60s (generated by generate.py, do not edit by hand)",
          "QueryLanguage": "JSONata",
          "StartAt": "Lease",
          "States": {
            "Lease": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:runMicrovm.waitForTaskToken",
              "Arguments": {
                "ImageIdentifier": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${ImageName}",
                "ExecutionRoleArn": "${AgentExecutionRole.Arn}",
                "RunHookPayload": "{% $string({'lease': {'kind': 'sfn', 'token': $states.context.Task.Token, 'region': '${AWS::Region}', 'heartbeat_s': 10, 'id': $states.context.Execution.Name}, 'task': $states.input}) %}",
                "IdlePolicy": {
                  "MaxIdleDurationSeconds": ${ShortBudget},
                  "SuspendedDurationSeconds": 60,
                  "AutoResumeEnabled": false
                },
                "MaximumDurationInSeconds": "{% ${ShortBudget} + 60 %}",
                "ClientToken": "{% $substring($states.context.Execution.Name & '-' & $states.context.State.Name, 0, 128) %}"
              },
              "TimeoutSeconds": ${ShortBudget},
              "HeartbeatSeconds": 30,
              "Retry": [
                {
                  "ErrorEquals": [
                    "LambdaMicrovms.ThrottlingException",
                    "LambdaMicrovms.ServiceQuotaExceededException"
                  ],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 8,
                  "BackoffRate": 2,
                  "JitterStrategy": "FULL"
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.Timeout",
                    "States.HeartbeatTimeout",
                    "States.TaskFailed"
                  ],
                  "Assign": {
                    "lease_error": "{% $states.errorOutput %}"
                  },
                  "Next": "Reap"
                }
              ],
              "Assign": {
                "vm": "{% $states.result.microvm_id %}"
              },
              "Next": "Terminate"
            },
            "Terminate": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:terminateMicrovm",
              "Arguments": {
                "MicrovmIdentifier": "{% $vm %}"
              },
              "Retry": [
                {
                  "ErrorEquals": [
                    "LambdaMicrovms.ThrottlingException",
                    "LambdaMicrovms.ServiceQuotaExceededException"
                  ],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 8,
                  "BackoffRate": 2,
                  "JitterStrategy": "FULL"
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": [
                    "LambdaMicrovms.ResourceNotFoundException"
                  ],
                  "Output": "{% $states.input %}",
                  "Next": "Done"
                }
              ],
              "Output": "{% $states.input %}",
              "Next": "Done"
            },
            "Reap": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:listMicrovms",
              "Arguments": {
                "ImageIdentifier": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${ImageName}"
              },
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],
                  "Next": "Failed"
                }
              ],
              "Next": "TerminateStale"
            },
            "TerminateStale": {
              "Type": "Map",
              "Items": "{% [$states.input.Items[State in ['RUNNING', 'SUSPENDED', 'PENDING'] and $toMillis(StartedAt) < $toMillis($now()) - (${ShortBudget} + 60) * 1000]] %}",
              "MaxConcurrency": 4,
              "ItemProcessor": {
                "ProcessorConfig": {
                  "Mode": "INLINE"
                },
                "StartAt": "TerminateOne",
                "States": {
                  "TerminateOne": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::aws-sdk:lambdamicrovms:terminateMicrovm",
                    "Arguments": {
                      "MicrovmIdentifier": "{% $states.input.MicrovmId %}"
                    },
                    "Retry": [
                      {
                        "ErrorEquals": [
                          "LambdaMicrovms.ThrottlingException",
                          "LambdaMicrovms.ServiceQuotaExceededException"
                        ],
                        "IntervalSeconds": 2,
                        "MaxAttempts": 8,
                        "BackoffRate": 2,
                        "JitterStrategy": "FULL"
                      }
                    ],
                    "Catch": [
                      {
                        "ErrorEquals": [
                          "LambdaMicrovms.ResourceNotFoundException"
                        ],
                        "Next": "AlreadyGone"
                      }
                    ],
                    "End": true
                  },
                  "AlreadyGone": {
                    "Type": "Pass",
                    "End": true
                  }
                }
              },
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],
                  "Next": "Failed"
                }
              ],
              "Next": "Failed"
            },
            "Failed": {
              "Type": "Fail",
              "Error": "LeaseFailed",
              "Cause": "{% $string($lease_error) %}"
            },
            "Done": {
              "Type": "Succeed"
            }
          }
        }

Outputs:
  StateMachineArn:
    Value: !Ref StateMachine
    Description: Start executions here with the task object as input; run.py reads it from the stack.
  ShortStateMachineArn:
    Value: !Ref ShortStateMachine
    Description: The ShortBudget machine, used by the hang scenario.
  AgentExecutionRoleArn:
    Value: !GetAtt AgentExecutionRole.Arn
    Description: Pass as MVM_EXECUTION_ROLE_ARN when leasing the agent image by hand.
  LogGroupName:
    Value: !Ref StateMachineLogs
    Description: Where both machines write their execution logs.
